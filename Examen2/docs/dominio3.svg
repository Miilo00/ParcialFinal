  <rect x="70" y="330" width="340" height="150" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="240" y="365" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#166534">FabricaExamenSangreEstandar</text>
  <line x1="95" y1="385" x2="385" y2="385" stroke="#94a3b8"/>
  <text x="95" y="415" font-family="Arial" font-size="15">+ crear(...): ExamenSangre</text>
  <text x="95" y="445" font-family="Arial" font-size="14" fill="#166534">Implementación concreta</text>

  <rect x="530" y="420" width="440" height="230" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/>
  <text x="750" y="455" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#9a3412">«Adapter» FileSerializacionAdapter</text>

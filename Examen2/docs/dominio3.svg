  <line x1="555" y1="145" x2="945" y2="145" stroke="#94a3b8"/>
  <text x="555" y="175" font-family="Arial" font-size="16">- codigoExamen: String</text>
  <text x="555" y="205" font-family="Arial" font-size="16">- nombrePaciente: String</text>
  <text x="555" y="235" font-family="Arial" font-size="16">- costo: BigDecimal</text>

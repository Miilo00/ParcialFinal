  <text x="240" y="155" text-anchor="middle" font-family="Arial" font-size="17">FabricaExamenSangre</text>
  <line x1="95" y1="175" x2="385" y2="175" stroke="#94a3b8"/>
  <text x="95" y="205" font-family="Arial" font-size="15">+ crear(...): ExamenSangre</text>
  <text x="95" y="235" font-family="Arial" font-size="15"># convertirCosto(...)</text>

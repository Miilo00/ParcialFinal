  <rect x="1090" y="700" width="340" height="150" rx="16" fill="#f3f4f6" stroke="#475569" stroke-width="4"/>
  <text x="1260" y="735" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#334155">ExamenService</text>
  <line x1="1115" y1="755" x2="1405" y2="755" stroke="#94a3b8"/>
  <text x="1115" y="785" font-family="Arial" font-size="15">- fabricaExamen</text>
  <text x="1115" y="815" font-family="Arial" font-size="15">- estrategiaOrden</text>


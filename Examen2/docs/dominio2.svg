<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#f7fafc"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#1f2937">Diagrama de dominio — Exámenes de Sangre</text>

  <rect x="70" y="130" width="420" height="380" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <rect x="70" y="130" width="420" height="68" rx="18" fill="#2563eb"/>
  <text x="280" y="174" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="white">ExamenSangre</text>
  <text x="95" y="235" font-family="Arial" font-size="19" fill="#111827">- codigoExamen: String</text>
  <text x="95" y="275" font-family="Arial" font-size="19" fill="#111827">- nombrePaciente: String</text>
  <text x="95" y="315" font-family="Arial" font-size="19" fill="#111827">- costo: BigDecimal</text>
  <text x="95" y="355" font-family="Arial" font-size="19" fill="#111827">- tipoSangre: TipoSangre</text>
  <text x="95" y="395" font-family="Arial" font-size="19" fill="#111827">- factorRH: FactorRH</text>
  <line x1="95" y1="420" x2="465" y2="420" stroke="#94a3b8" stroke-width="2"/>
  <text x="95" y="455" font-family="Arial" font-size="18" fill="#111827">+ validarInvariantes()</text>
  <text x="95" y="485" font-family="Arial" font-size="18" fill="#111827">+ toString(): String</text>

  <rect x="710" y="120" width="350" height="180" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
  <rect x="710" y="120" width="350" height="58" rx="18" fill="#16a34a"/>
  <text x="885" y="158" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="white">«enumeración» TipoSangre</text>
  <text x="740" y="215" font-family="Arial" font-size="20" fill="#111827">A · B · AB · O</text>
  <text x="740" y="255" font-family="Arial" font-size="17" fill="#334155">desdeTexto(String)</text>

  <rect x="710" y="350" width="350" height="180" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/>
  <rect x="710" y="350" width="350" height="58" rx="18" fill="#7c3aed"/>
  <text x="885" y="388" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="white">«enumeración» FactorRH</text>
  <text x="740" y="445" font-family="Arial" font-size="20" fill="#111827">POSITIVO (+)</text>
  <text x="740" y="485" font-family="Arial" font-size="20" fill="#111827">NEGATIVO (-)</text>

  <line x1="490" y1="340" x2="710" y2="210" stroke="#475569" stroke-width="3" marker-end="url(#flecha)"/>
  <line x1="490" y1="390" x2="710" y2="440" stroke="#475569" stroke-width="3" marker-end="url(#flecha)"/>

  <rect x="70" y="575" width="990" height="82" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="565" y="611" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#1e3a8a">Reglas invariantes del dominio</text>
  <text x="565" y="638" text-anchor="middle" font-family="Arial" font-size="16" fill="#334155">Código y paciente obligatorios · costo mayor que cero · tipo de sangre y factor RH obligatorios</text>

  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
